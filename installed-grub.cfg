# No fixed disk identity: configuration is written on the selected ESP at install time.
insmod part_gpt
insmod fat
insmod zfs
insmod all_video
terminal_input console
terminal_output console
if [ -f $cmdpath/efi32.cfg ]; then
    configfile $cmdpath/efi32.cfg
fi
echo 'EFI32 boot configuration missing or failed. Boot the installer for recovery.'
sleep --interruptible 60
