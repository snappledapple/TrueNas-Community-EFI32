insmod part_msdos
insmod part_gpt
insmod fat
insmod iso9660
insmod all_video
set timeout=-1
set default=0
terminal_input console
terminal_output console
echo 'Community EFI32 TrueNAS installer - experimental'
menuentry 'Install TrueNAS - EFI32 compatibility' {
    search --no-floppy --file --set=payload /.disk/2026-10-05-17-13-03-00.uuid
    set root=$payload
    linux /vmlinuz gfxpayload=text nomodeset noefi boot=live toram=filesystem.squashfs efi32_compat=1 console=tty0
    initrd /initrd.img
}
menuentry 'EFI32 diagnostics - serial console' {
    search --no-floppy --file --set=payload /.disk/2026-10-05-17-13-03-00.uuid
    set root=$payload
    linux /vmlinuz gfxpayload=text nomodeset noefi boot=live toram=filesystem.squashfs efi32_compat=1 console=tty0 console=ttyS0,115200n8
    initrd /initrd.img
}
menuentry 'Reboot' { reboot }
menuentry 'Power off' { halt }
