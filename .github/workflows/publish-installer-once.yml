{
  "name": "Publish experimental EFI32 installer",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/publish-installer-once.yml"
      ]
    }
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "publish": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "steps": [
        {
          "name": "Verify MEGA download and publish matching split assets",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "EFI32_RELEASE_PLAN": "{\"repository\": \"snappledapple/TrueNas-Community-EFI32\", \"commit\": \"dfcf09580c228b599ac234638df7cf979479b144\", \"tag\": \"v27.0.0-rc.1-efi32.1\", \"title\": \"TrueNAS EFI32 installer - 27.0.0-RC.1 community test\", \"notes\": \"# TrueNAS EFI32 installer - 27.0.0-RC.1\\n\\nExperimental USB installer for early Intel Macs with 32-bit EFI and 64-bit CPUs.\\n\\nThis build adds an IA32 bootloader, an EFI-variable compatibility hook, destination EFI boot files and optional temporary SSH. The image contains no personal credentials or fixed network settings. Installation uses the normal drive-selection and administrator prompts.\\n\\n## Download\\n\\nChoose either download option:\\n\\n- **MEGA:** [download the complete ZIP](https://mega.nz/file/03olHabJ#Ql9C_EvIUTAVWqiirUfBEDXjLdx9HTR1cT6MUTR8NWg) (2.60 GB) and extract `TrueNAS-27-RC1-EFI32.img`.\\n- **GitHub:** download `TrueNAS-27-RC1-EFI32.img.part-001`, `TrueNAS-27-RC1-EFI32.img.part-002`, `download-manifest.json` and `Join-Image.ps1` from this release's **Assets** into one folder. Open PowerShell there and run:\\n\\n  ```powershell\\n  powershell -NoProfile -ExecutionPolicy Bypass -File .\\\\Join-Image.ps1\\n  ```\\n\\nThe script verifies the parts and creates `TrueNAS-27-RC1-EFI32.img`. Both options produce the same image. On Linux or macOS, concatenate the parts in numerical order and check the image against `SHA256SUMS.txt`. GitHub's automatic source archives contain the code, not the installer image.\\n\\nFlash the extracted `.img` with Rufus in DD mode or balenaEtcher, then hold Option at Mac startup and select the USB EFI entry. Choose **Install TrueNAS - EFI32 compatibility**, then **Install/Upgrade**.\\n\\nSHA256 checksums:\\n\\n```text\\neb7887c7f3b6874c9a2d32ed42b52580a99be8fc4ba7ec6d73762f87a3037f8d  TrueNAS-27-RC1-EFI32.img.zip\\nbcce89636df2afd096e883564f12af7b9c4ca2713c39beb8bd91a74f7e47fb37  TrueNAS-27-RC1-EFI32.img\\n```\\n\\nFlashing erases the USB. Installing erases the selected destination drive. Keep other OS and data drives disconnected where practical.\\n\\n## Test status\\n\\nThe USB installer has started on a MacPro2,1, including temporary SSH. A virtual EFI32 test completed installation and loaded the installed kernel from ZFS with its USB detached.\\n\\nThe installed VM also reported startup failures in `nscd`, `syslog-ng`, `chrony` and `nginx`. Full service readiness, direct physical SSD boot, updates and boot-environment rollback remain unverified. Firmware must be able to read the destination drive; PCIe NVMe visibility in Linux does not establish boot support.\\n\\nPackage versions and license notices are included with the downloads. See the repository README for installation and SSH instructions.\\n\", \"mega_url\": \"https://mega.nz/file/03olHabJ#Ql9C_EvIUTAVWqiirUfBEDXjLdx9HTR1cT6MUTR8NWg\", \"zip_bytes\": 2602382579, \"zip_sha256\": \"eb7887c7f3b6874c9a2d32ed42b52580a99be8fc4ba7ec6d73762f87a3037f8d\", \"image_name\": \"TrueNAS-27-RC1-EFI32.img\", \"image_bytes\": 2901409792, \"image_sha256\": \"bcce89636df2afd096e883564f12af7b9c4ca2713c39beb8bd91a74f7e47fb37\", \"parts\": [{\"file\": \"TrueNAS-27-RC1-EFI32.img.part-001\", \"bytes\": 1887436800, \"sha256\": \"63284661d76fb215e6d9501d86a2b06438b7d788b550057571ddfc67db6d0f7d\"}, {\"file\": \"TrueNAS-27-RC1-EFI32.img.part-002\", \"bytes\": 1013972992, \"sha256\": \"b11bb075762c8f77528d79ff0642a70308a82b47337cd4d1657ea4305ade6e35\"}], \"assets\": [{\"name\": \"COMPONENTS.txt\", \"bytes\": 7116, \"sha256\": \"434ff96d62b6df4301a87494bb5fa1d8a75bbe251aa579653438c3fa2483da97\"}, {\"name\": \"download-manifest.json\", \"bytes\": 527, \"sha256\": \"e9391831bd7fd2e90a22fd8bbb4bedc2486327970bad41cb6886e4356bbc7a3e\"}, {\"name\": \"GRUB-COPYING.txt\", \"bytes\": 35149, \"sha256\": \"3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986\"}, {\"name\": \"Join-Image.ps1\", \"bytes\": 2065, \"sha256\": \"532ab6eeb15eecd4412227950662e29102faf6f9d4023c55b48af7fda1bc77c0\"}, {\"name\": \"LICENSE\", \"bytes\": 1200, \"sha256\": \"9857c31dff305145e2d89d994fb1edbffabb1bebf687368a0103aae90cdcc9fd\"}, {\"name\": \"SHA256SUMS.txt\", \"bytes\": 885, \"sha256\": \"998ef2f2f4a1af9b449814381ff55f418f01c433d0b344e0c2290643347659a1\"}, {\"name\": \"THIRD_PARTY.md\", \"bytes\": 1369, \"sha256\": \"1cc3f786ca6f1df8f419218c2948de391e6a17d99e4b6660b001210a3f280632\"}, {\"name\": \"TrueNAS-27-RC1-EFI32.img.part-001\", \"bytes\": 1887436800, \"sha256\": \"63284661d76fb215e6d9501d86a2b06438b7d788b550057571ddfc67db6d0f7d\"}, {\"name\": \"TrueNAS-27-RC1-EFI32.img.part-002\", \"bytes\": 1013972992, \"sha256\": \"b11bb075762c8f77528d79ff0642a70308a82b47337cd4d1657ea4305ade6e35\"}], \"source_files\": [\"Join-Image.ps1\", \"GRUB-COPYING.txt\", \"LICENSE\", \"THIRD_PARTY.md\"], \"embedded_files\": {\"COMPONENTS.txt\": \"\", \"download-manifest.json\": \"\", \"SHA256SUMS.txt\": \"\"}}"
          },
          "run": "python3 - <<'PY'\nimport json, os\nPLAN = json.loads(os.environ['EFI32_RELEASE_PLAN'])\n\"\"\"One-time GitHub runner job. PLAN is inserted before execution.\"\"\"\nimport base64\nimport hashlib\nimport http.client\nimport json\nimport os\nfrom pathlib import Path\nimport subprocess\nimport tempfile\nimport urllib.error\nimport urllib.parse\nimport urllib.request\nimport zipfile\n\n\ndef digest(path):\n    h = hashlib.sha256()\n    with path.open('rb') as stream:\n        while chunk := stream.read(8 * 1024**2):\n            h.update(chunk)\n    return h.hexdigest()\n\n\ndef github(path, method='GET', body=None):\n    assert path.startswith('/repos/' + PLAN['repository'] + '/')\n    payload = None if body is None else json.dumps(body).encode()\n    request = urllib.request.Request('https://api.github.com' + path, data=payload,\n        method=method, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],\n        'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',\n        'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'EFI32-release-publisher'})\n    with urllib.request.urlopen(request, timeout=120) as response:\n        return None if response.status == 204 else json.load(response)\n\n\ndef upload(release_id, path):\n    connection = http.client.HTTPSConnection('uploads.github.com', timeout=180)\n    target = '/repos/' + PLAN['repository'] + '/releases/' + str(release_id)\n    target += '/assets?' + urllib.parse.urlencode({'name': path.name})\n    try:\n        connection.putrequest('POST', target)\n        for name, value in {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],\n                'Accept': 'application/vnd.github+json', 'Content-Type': 'application/octet-stream',\n                'Content-Length': str(path.stat().st_size),\n                'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'EFI32-release-publisher'}.items():\n            connection.putheader(name, value)\n        connection.endheaders()\n        with path.open('rb') as stream:\n            while chunk := stream.read(8 * 1024**2):\n                connection.send(chunk)\n        response = connection.getresponse()\n        result = json.load(response)\n        if response.status != 201:\n            raise RuntimeError('Upload failed: HTTP ' + str(response.status))\n        return result\n    finally:\n        connection.close()\n\n\nwith tempfile.TemporaryDirectory(prefix='efi32-release-') as directory:\n    work = Path(directory)\n    archive = work / 'TrueNAS-27-RC1-EFI32.img.zip'\n    link = urllib.parse.urlsplit(PLAN['mega_url'])\n    node = link.path.rsplit('/', 1)[1]\n    key = base64.urlsafe_b64decode(link.fragment + '=' * (-len(link.fragment) % 4))\n    assert len(key) == 32\n    cipher_key = bytes(a ^ b for a, b in zip(key[:16], key[16:]))\n    iv = key[16:24] + bytes(8)\n    request = urllib.request.Request('https://g.api.mega.co.nz/cs?id=6011053',\n        data=json.dumps([{'a': 'g', 'g': 1, 'p': node, 'ssl': 2}]).encode(),\n        headers={'Content-Type': 'application/json'})\n    with urllib.request.urlopen(request, timeout=90) as response:\n        info = json.load(response)[0]\n    assert isinstance(info, dict) and info['s'] == PLAN['zip_bytes']\n    assert urllib.parse.urlsplit(info['g']).scheme == 'https'\n    print('Downloading the public MEGA ZIP', flush=True)\n    with archive.open('wb') as output:\n        decrypt = subprocess.Popen(['openssl', 'enc', '-d', '-aes-128-ctr',\n            '-K', cipher_key.hex(), '-iv', iv.hex()], stdin=subprocess.PIPE, stdout=output)\n        downloaded = 0\n        try:\n            with urllib.request.urlopen(info['g'], timeout=120) as response:\n                while chunk := response.read(8 * 1024**2):\n                    downloaded += len(chunk)\n                    if downloaded > PLAN['zip_bytes']:\n                        raise RuntimeError('Unexpected download size')\n                    decrypt.stdin.write(chunk)\n                    if downloaded // (256 * 1024**2) != (downloaded - len(chunk)) // (256 * 1024**2):\n                        print('Downloaded ' + str(downloaded // 1024**2) + ' MiB', flush=True)\n        except BaseException:\n            decrypt.kill()\n            try:\n                decrypt.stdin.close()\n            except BrokenPipeError:\n                pass\n            decrypt.wait(timeout=10)\n            raise\n        decrypt.stdin.close()\n        returncode = decrypt.wait(timeout=60)\n        assert returncode == 0 and downloaded == PLAN['zip_bytes']\n    assert archive.stat().st_size == PLAN['zip_bytes'] and digest(archive) == PLAN['zip_sha256']\n    print('Complete remote ZIP SHA256 verified', flush=True)\n\n    with zipfile.ZipFile(archive) as package:\n        entries = package.infolist()\n        assert len(entries) == 1 and entries[0].filename == PLAN['image_name']\n        assert entries[0].file_size == PLAN['image_bytes']\n        whole = hashlib.sha256()\n        with package.open(entries[0]) as source:\n            for part in PLAN['parts']:\n                remaining = part['bytes']\n                with (work / part['file']).open('xb') as destination:\n                    while remaining:\n                        chunk = source.read(min(8 * 1024**2, remaining))\n                        assert chunk\n                        destination.write(chunk)\n                        whole.update(chunk)\n                        remaining -= len(chunk)\n            assert not source.read(1)\n        assert whole.hexdigest() == PLAN['image_sha256']\n    print('Extracted image SHA256 verified; both parts reproduced', flush=True)\n\n    for name, content in PLAN['embedded_files'].items():\n        assert Path(name).name == name\n        (work / name).write_bytes(base64.b64decode(content))\n    for name in PLAN['source_files']:\n        assert Path(name).name == name\n        url = 'https://raw.githubusercontent.com/' + PLAN['repository'] + '/' + PLAN['commit'] + '/' + name\n        with urllib.request.urlopen(url, timeout=60) as response:\n            (work / name).write_bytes(response.read())\n    for item in PLAN['assets']:\n        path = work / item['name']\n        assert path.stat().st_size == item['bytes'] and digest(path) == item['sha256']\n\n    prefix = '/repos/' + PLAN['repository'] + '/releases'\n    matches = [item for item in github(prefix + '?per_page=100')\n               if item['tag_name'] == PLAN['tag']]\n    assert len(matches) <= 1\n    if matches:\n        release = matches[0]\n        assert release['draft'] and release['target_commitish'] == PLAN['commit']\n    else:\n        release = github(prefix, 'POST', {'tag_name': PLAN['tag'], 'target_commitish': PLAN['commit'],\n            'name': PLAN['title'], 'body': PLAN['notes'], 'draft': True, 'prerelease': True})\n    existing = {item['name']: item for item in release['assets']}\n    expected = {item['name']: item for item in PLAN['assets']}\n    assert set(existing).issubset(expected)\n    for name, wanted in expected.items():\n        asset = existing.get(name)\n        if asset is not None and (asset['state'] != 'uploaded' or\n                asset['size'] != wanted['bytes'] or\n                asset.get('digest') != 'sha256:' + wanted['sha256']):\n            # Only an expected file in this verified, unpublished draft can be replaced.\n            github(prefix + '/assets/' + str(asset['id']), 'DELETE')\n            asset = None\n        if asset is None:\n            print('Uploading ' + name, flush=True)\n            asset = upload(release['id'], work / name)\n        assert asset['state'] == 'uploaded' and asset['size'] == wanted['bytes']\n        assert asset['digest'] == 'sha256:' + wanted['sha256']\n        print('Verified server SHA256: ' + name, flush=True)\n    release = github(prefix + '/' + str(release['id']))\n    assert {item['name'] for item in release['assets']} == set(expected)\n    for item in release['assets']:\n        assert item['size'] == expected[item['name']]['bytes']\n        assert item['digest'] == 'sha256:' + expected[item['name']]['sha256']\n    result = github(prefix + '/' + str(release['id']), 'PATCH',\n        {'draft': False, 'prerelease': True, 'make_latest': 'false'})\n    print('Published verified experimental prerelease: ' + result['html_url'], flush=True)\n\nPY\n"
        }
      ]
    }
  }
}
